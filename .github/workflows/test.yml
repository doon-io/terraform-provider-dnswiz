name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - run: go vet ./...

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -v -count=1 -timeout=5m ./...

  # Fails the build if the committed docs/ tree doesn't match what
  # tfplugindocs would generate from the current schema and examples.
  # Catches "I changed the schema but forgot to run make generate".
  docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make generate
      - name: Check docs are up to date
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "::error::docs/ is stale. Run 'make generate' locally and commit."
            git diff docs/
            exit 1
          fi
